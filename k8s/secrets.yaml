apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: cardmgmt
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: cardmanagement
  CONNECTION_STRING: "Host=postgres;Port=5432;Database=cardmanagement;Username=postgres;Password=postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: cardmgmt
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: nginx-tls
  namespace: cardmgmt
type: kubernetes.io/tls
data:
  # Replace with base64-encoded cert and key from nginx/certs/
  tls.crt: ""
  tls.key: ""
