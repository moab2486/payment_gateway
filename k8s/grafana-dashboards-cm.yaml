apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: cardmgmt
  labels:
    app: grafana
data:
  red-use-dashboard.json: |
    {
      "annotations": {"list": [{"builtIn": 1, "datasource": "-- Grafana --", "enable": true, "hide": true, "iconColor": "rgba(0, 211, 255, 1)", "name": "Annotations & Alerts", "type": "dashboard"}]},
      "description": "Card Management Payment Gateway — RED & USE Metrics",
      "editable": true,
      "panels": [
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "id": 100, "title": "RED Metrics — Rate, Errors, Duration", "type": "row"},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "reqps"}}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 1}, "id": 1, "title": "Request Rate", "type": "timeseries", "targets": [{"expr": "sum(rate(http_server_request_duration_seconds_count[5m])) by (http_route)", "legendFormat": "{{http_route}}"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"fixedColor": "red", "mode": "fixed"}, "custom": {"fillOpacity": 30, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "reqps"}}, "gridPos": {"h": 8, "w": 8, "x": 8, "y": 1}, "id": 2, "title": "Error Rate (5xx)", "type": "timeseries", "targets": [{"expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) by (http_route)", "legendFormat": "{{http_route}}"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "s"}}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 1}, "id": 3, "title": "Request Duration (p95)", "type": "timeseries", "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, http_route))", "legendFormat": "p95 {{http_route}}"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.01}, {"color": "red", "value": 0.05}]}, "unit": "percentunit"}}, "gridPos": {"h": 4, "w": 6, "x": 0, "y": 9}, "id": 4, "title": "Error Rate %", "type": "stat", "targets": [{"expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 100}, {"color": "red", "value": 500}]}, "unit": "reqps"}}, "gridPos": {"h": 4, "w": 6, "x": 6, "y": 9}, "id": 5, "title": "Total Throughput", "type": "stat", "targets": [{"expr": "sum(rate(http_server_request_duration_seconds_count[5m]))"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.2}, {"color": "red", "value": 1.0}]}, "unit": "s"}}, "gridPos": {"h": 4, "w": 6, "x": 12, "y": 9}, "id": 6, "title": "Avg Latency", "type": "stat", "targets": [{"expr": "sum(rate(http_server_request_duration_seconds_sum[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 50}, {"color": "red", "value": 100}]}, "unit": "short"}}, "gridPos": {"h": 4, "w": 6, "x": 18, "y": 9}, "id": 7, "title": "Active Requests", "type": "gauge", "targets": [{"expr": "sum(http_server_active_requests)"}]},
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 13}, "id": 101, "title": "USE Metrics — Utilization, Saturation, Errors", "type": "row"},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "decbytes"}}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 14}, "id": 10, "title": "Heap Memory (Utilization)", "type": "timeseries", "targets": [{"expr": "process_runtime_dotnet_gc_heap_size_bytes{job=\"card-management-api\"}", "legendFormat": "Heap Size"}, {"expr": "process_runtime_dotnet_gc_committed_memory_size_bytes{job=\"card-management-api\"}", "legendFormat": "Committed"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "short"}}, "gridPos": {"h": 8, "w": 8, "x": 8, "y": 14}, "id": 11, "title": "Thread Pool (Saturation)", "type": "timeseries", "targets": [{"expr": "process_runtime_dotnet_thread_pool_queue_length{job=\"card-management-api\"}", "legendFormat": "Queue Length"}, {"expr": "process_runtime_dotnet_thread_pool_threads_count{job=\"card-management-api\"}", "legendFormat": "Thread Count"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "short"}}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 14}, "id": 12, "title": "GC Collections (Pressure)", "type": "timeseries", "targets": [{"expr": "rate(process_runtime_dotnet_gc_collections_count_total{job=\"card-management-api\",generation=\"gen0\"}[5m])", "legendFormat": "Gen0/s"}, {"expr": "rate(process_runtime_dotnet_gc_collections_count_total{job=\"card-management-api\",generation=\"gen1\"}[5m])", "legendFormat": "Gen1/s"}, {"expr": "rate(process_runtime_dotnet_gc_collections_count_total{job=\"card-management-api\",generation=\"gen2\"}[5m])", "legendFormat": "Gen2/s"}]},
        {"collapsed": false, "gridPos": {"h": 1, "w": 24, "x": 0, "y": 22}, "id": 102, "title": "Outbound HTTP (USE)", "type": "row"},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"fillOpacity": 15, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "reqps"}}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 23}, "id": 20, "title": "Outbound HTTP Rate", "type": "timeseries", "targets": [{"expr": "sum(rate(http_client_request_duration_seconds_count[5m])) by (server_address)", "legendFormat": "{{server_address}}"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"fillOpacity": 15, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "s"}}, "gridPos": {"h": 8, "w": 8, "x": 8, "y": 23}, "id": 21, "title": "Outbound HTTP Duration (p95)", "type": "timeseries", "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_client_request_duration_seconds_bucket[5m])) by (le, server_address))", "legendFormat": "p95 {{server_address}}"}]},
        {"datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}, "fieldConfig": {"defaults": {"color": {"fixedColor": "red", "mode": "fixed"}, "custom": {"fillOpacity": 30, "lineWidth": 2, "showPoints": "never", "gradientMode": "scheme"}, "unit": "reqps"}}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 23}, "id": 22, "title": "Outbound HTTP Errors", "type": "timeseries", "targets": [{"expr": "sum(rate(http_client_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) by (server_address)", "legendFormat": "5xx {{server_address}}"}]}
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["RED", "USE", "payment-gateway", "dotnet"],
      "templating": {"list": [{"current": {"selected": false, "text": "Prometheus", "value": "Prometheus"}, "hide": 0, "label": "Data Source", "name": "DS_PROMETHEUS", "query": "prometheus", "refresh": 1, "type": "datasource"}]},
      "time": {"from": "now-30m", "to": "now"},
      "timezone": "browser",
      "title": "Card Management — RED & USE Dashboard",
      "uid": "cardmgmt-red-use",
      "version": 1
    }
