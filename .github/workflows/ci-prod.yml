name: CI — Production Branch (Build, Test, Push & Deploy)

on:
  pull_request:
    branches: [prod]

concurrency:
  group: ci-prod-${{ github.head_ref }}
  cancel-in-progress: false

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: card-management-app

jobs:
  validate-source-branch:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source is staging branch
        if: github.head_ref != 'staging'
        run: |
          echo "❌ Only PRs from 'staging' branch are accepted into 'prod'."
          echo "   Source branch: ${{ github.head_ref }}"
          exit 1

  build-and-test:
    name: Full Validation
    runs-on: ubuntu-latest
    needs: validate-source-branch

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardmanagement
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Run All Tests
        env:
          DATABASE__CONNECTION_STRING: "Host=localhost;Port=5432;Database=cardmanagement;Username=postgres;Password=postgres"
          DeveloperPortal__ApiKeyCache__RedisConnectionString: "localhost:6379"
        run: |
          dotnet test -c Release --no-build \
            --logger "trx;LogFileName=all-tests.trx" \
            --results-directory ./test-results

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-prod
          path: ./test-results/*.trx
          retention-days: 30

  push-image:
    name: Push Docker Image to ACR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event.pull_request.merged == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                     ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: push-image
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/card-management-app \
            app=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n cardmgmt
          kubectl rollout status deployment/card-management-app -n cardmgmt --timeout=300s

      - name: Verify Deployment Health
        run: |
          kubectl -n cardmgmt get pods -l app=card-management-app
          kubectl -n cardmgmt rollout status deployment/card-management-app
